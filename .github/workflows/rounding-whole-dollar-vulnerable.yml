name: USDN vulnerable whole-dollar liquidation validation

on:
  push:
    branches:
      - security/usdn-rounding-whole-dollar-vulnerable-validation

permissions:
  contents: read

jobs:
  validate-vulnerable-side:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-50dd4b8accae878391b0825885f0632d1e0a1e4c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Exact whole-dollar vulnerable-side witness
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapWholeDollarVulnerable -vvvv
      - name: Preserve real upstream Rebalancer safety check
        run: forge test --match-test test_RevertWhen_triggerRebalancerWithTotalExpoBelowLongBalance -vvvv
