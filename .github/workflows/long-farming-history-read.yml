name: USDN LongFarming historical zero-share reconstruction

on:
  push:
    branches:
      - security/usdn-long-farming-zero-share-backlog

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Reconstruct Deposit/Withdraw/Slash position-count timeline
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          LONG_FARMING: '0xF9D36078A248AF249AA57ae1D5D0c1033d6Bbe27'
        run: |
          set -euo pipefail
          export DEP_TOPIC=$(cast keccak 'Deposit(address,int24,uint256,uint256)')
          export WDR_TOPIC=$(cast keccak 'Withdraw(address,int24,uint256,uint256)')
          export SLS_TOPIC=$(cast keccak 'Slash(address,uint256,uint256,int24,uint256,uint256)')
          python3 - <<'PY'
          import os, json, urllib.request, time

          rpc = os.environ['RPC_URL']
          addr = os.environ['LONG_FARMING'].lower()
          dep = os.environ['DEP_TOPIC'].lower()
          wdr = os.environ['WDR_TOPIC'].lower()
          sls = os.environ['SLS_TOPIC'].lower()

          # Campaign 20 starts at 21,683,491. Positive emissions end at 25,056,370.
          lo, hi = 21_683_491, 25_056_370
          chunk = 40_000

          def rpc_call(method, params):
              payload = json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode()
              req = urllib.request.Request(rpc, data=payload, headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  out = json.load(r)
              if 'error' in out:
                  raise RuntimeError(out['error'])
              return out['result']

          # Find first block with deployed code to bound the event reconstruction.
          a, b = lo, hi
          if rpc_call('eth_getCode', [addr, hex(b)]) == '0x':
              raise RuntimeError('LongFarming not deployed by end of positive-emission history')
          while a < b:
              m = (a+b)//2
              if rpc_call('eth_getCode', [addr, hex(m)]) != '0x':
                  b = m
              else:
                  a = m+1
          deployment = a
          print('deploymentBlock', deployment)

          logs = []
          start = deployment
          topics = [[dep, wdr, sls]]
          while start <= hi:
              end = min(start + chunk - 1, hi)
              flt = {'address': addr, 'fromBlock': hex(start), 'toBlock': hex(end), 'topics': topics}
              batch = rpc_call('eth_getLogs', [flt])
              logs.extend(batch)
              print('scanned', start, end, 'events', len(batch))
              start = end + 1

          logs.sort(key=lambda x:(int(x['blockNumber'],16), int(x['transactionIndex'],16), int(x['logIndex'],16)))
          count = 0
          zero_windows = []
          zero_start = deployment
          transitions=[]
          for log in logs:
              block = int(log['blockNumber'],16)
              topic = log['topics'][0].lower()
              before=count
              if topic == dep:
                  count += 1
                  kind='Deposit'
              elif topic in (wdr,sls):
                  count -= 1
                  kind='Withdraw' if topic==wdr else 'Slash'
              else:
                  continue
              if count < 0:
                  raise RuntimeError(f'negative reconstructed count at block {block}')
              transitions.append((block,kind,before,count,log['transactionHash']))
              if before==0 and count>0 and zero_start is not None:
                  zero_windows.append((zero_start, block))
                  zero_start=None
              elif before>0 and count==0:
                  zero_start=block
          if zero_start is not None:
              zero_windows.append((zero_start, hi+1))

          print('totalRelevantEvents', len(transitions))
          print('finalReconstructedCountAtPositiveEnd', count)
          print('first20Transitions')
          for x in transitions[:20]: print(x)
          print('last20Transitions')
          for x in transitions[-20:]: print(x)

          phases = [
              (21_684_000,21_776_314,149_146_814_241_486_068_111),
              (21_776_314,22_490_167,83_474_852_560_444_052_688),
              (22_490_167,23_808_566,17_439_128_063_659_028_867),
              (24_420_560,25_056_370,31_455_938_094_713_829_603),
          ]
          print('zeroWindowsIntersectingPositiveEmission')
          found=[]
          for zs,ze in zero_windows:
              for ps,pe,rpb in phases:
                  s=max(zs,ps); e=min(ze,pe)
                  if s<e:
                      blocks=e-s
                      emissions=blocks*rpb
                      found.append((s,e,blocks,rpb,emissions))
                      print('ZERO_POSITIVE',s,e,'blocks',blocks,'rewardPerBlock',rpb,'theoreticalIdleEmissionsWei',emissions)
          print('zeroPositiveWindowCount',len(found))
          if not found:
              print('NO historical zero-share window intersects a positive-emission phase')
          PY
