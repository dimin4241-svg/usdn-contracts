name: USDN LongFarming historical zero-share reconstruction

on:
  push:
    branches:
      - security/usdn-long-farming-zero-share-backlog

permissions:
  contents: read

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Reconstruct Deposit/Withdraw/Slash position-count timeline
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          LONG_FARMING: '0xF9D36078A248AF249AA57ae1D5D0c1033d6Bbe27'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, json, subprocess

          rpc = os.environ['RPC_URL']
          addr = os.environ['LONG_FARMING']
          lo, hi = 21_683_491, 25_056_370
          chunk = 20_000

          events = {
              'Deposit': 'Deposit(address,int24,uint256,uint256)',
              'Withdraw': 'Withdraw(address,int24,uint256,uint256)',
              'Slash': 'Slash(address,uint256,uint256,int24,uint256,uint256)',
          }

          def get_logs(sig, start, end):
              cmd = [
                  'cast','logs','--json','--rpc-url',rpc,'--address',addr,
                  '--from-block',str(start),'--to-block',str(end),sig
              ]
              raw = subprocess.check_output(cmd, text=True, stderr=subprocess.STDOUT).strip()
              return json.loads(raw) if raw else []

          logs=[]
          for start in range(lo, hi+1, chunk):
              end=min(start+chunk-1,hi)
              n=0
              for kind,sig in events.items():
                  batch=get_logs(sig,start,end)
                  for x in batch:
                      x['_kind']=kind
                  logs.extend(batch)
                  n += len(batch)
              print('scanned',start,end,'events',n)

          def to_int(v):
              if isinstance(v,int): return v
              return int(v,16) if str(v).startswith('0x') else int(v)

          logs.sort(key=lambda x:(to_int(x['blockNumber']),to_int(x.get('transactionIndex',0)),to_int(x.get('logIndex',0))))

          count=0
          zero_windows=[]
          zero_start=lo
          transitions=[]
          for log in logs:
              block=to_int(log['blockNumber'])
              kind=log['_kind']
              before=count
              if kind=='Deposit': count += 1
              else: count -= 1
              if count < 0:
                  raise RuntimeError(f'negative reconstructed count at block {block}, kind={kind}')
              transitions.append((block,kind,before,count,log.get('transactionHash')))
              if before==0 and count>0 and zero_start is not None:
                  zero_windows.append((zero_start,block))
                  zero_start=None
              elif before>0 and count==0:
                  zero_start=block
          if zero_start is not None:
              zero_windows.append((zero_start,hi+1))

          print('totalRelevantEvents',len(transitions))
          print('finalReconstructedCountAtPositiveEnd',count)
          print('first20Transitions')
          for x in transitions[:20]: print(x)
          print('last20Transitions')
          for x in transitions[-20:]: print(x)

          phases=[
              (21_684_000,21_776_314,149_146_814_241_486_068_111),
              (21_776_314,22_490_167,83_474_852_560_444_052_688),
              (22_490_167,23_808_566,17_439_128_063_659_028_867),
              (24_420_560,25_056_370,31_455_938_094_713_829_603),
          ]
          found=[]
          print('zeroWindowsIntersectingPositiveEmission')
          for zs,ze in zero_windows:
              for ps,pe,rpb in phases:
                  s=max(zs,ps); e=min(ze,pe)
                  if s<e:
                      blocks=e-s
                      emissions=blocks*rpb
                      found.append((s,e,blocks,rpb,emissions))
                      print('ZERO_POSITIVE',s,e,'blocks',blocks,'rewardPerBlock',rpb,'theoreticalIdleEmissionsWei',emissions)
          print('zeroPositiveWindowCount',len(found))
          if not found:
              print('NO historical zero-share window intersects a positive-emission phase')
          PY
