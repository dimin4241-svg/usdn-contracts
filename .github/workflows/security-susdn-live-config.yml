name: sUSDN live Enzyme configuration
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/security-susdn-live-config.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Query live sUSDN valuation configuration
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          VAULT: '0xF67e2dC041b8A3c39d066037d29f500757b1e886'
          SUSDE: '0x9D39A5DE30e57443BfF2A8307A4256c8797A3497'
          USDN: '0xde17a000BA631c5d7c2Bd9FB692EFeA52D90DEE2'
          USDNR: '0x82957d600963Ae0C529c3819Ac7C349c4D49269B'
        run: |
          set -euo pipefail
          BLOCK=$(cast block-number --rpc-url "$RPC_URL")
          ACCESSOR=$(cast call "$VAULT" 'getAccessor()(address)' --rpc-url "$RPC_URL")
          VI=$(cast call "$ACCESSOR" 'getValueInterpreter()(address)' --rpc-url "$RPC_URL")
          DENOM=$(cast call "$ACCESSOR" 'getDenominationAsset()(address)' --rpc-url "$RPC_URL")
          echo "SUSDN_BLOCK=$BLOCK"
          echo "ACCESSOR=$ACCESSOR"
          echo "DENOMINATION_ASSET=$DENOM"
          echo "VALUE_INTERPRETER=$VI"
          echo "VI_STALE_RATE_THRESHOLD=$(cast call "$VI" 'getStaleRateThreshold()(uint256)' --rpc-url "$RPC_URL")"
          echo "TOTAL_SUPPLY=$(cast call "$VAULT" 'totalSupply()(uint256)' --rpc-url "$RPC_URL")"
          echo "TRACKED_ASSETS=$(cast call "$VAULT" 'getTrackedAssets()(address[])' --rpc-url "$RPC_URL")"
          echo "GAV=$(cast call "$ACCESSOR" 'calcGav()(uint256)' --rpc-url "$RPC_URL")"
          echo "GROSS_SHARE_VALUE=$(cast call "$ACCESSOR" 'calcGrossShareValue()(uint256)' --rpc-url "$RPC_URL")"

          for asset in "$SUSDE" "$USDN" "$USDNR"; do
            feed=$(cast call "$VI" 'getAggregatorForPrimitive(address)(address)' "$asset" --rpc-url "$RPC_URL")
            echo "=== ASSET=$asset SYMBOL=$(cast call "$asset" 'symbol()(string)' --rpc-url "$RPC_URL") ==="
            echo "FEED=$feed"
            echo "RATE_ASSET=$(cast call "$VI" 'getRateAssetForPrimitive(address)(uint8)' "$asset" --rpc-url "$RPC_URL")"
            echo "UNIT=$(cast call "$VI" 'getUnitForPrimitive(address)(uint256)' "$asset" --rpc-url "$RPC_URL")"
            echo "FEED_DESCRIPTION=$(cast call "$feed" 'description()(string)' --rpc-url "$RPC_URL" || true)"
            echo "FEED_DECIMALS=$(cast call "$feed" 'decimals()(uint8)' --rpc-url "$RPC_URL" || true)"
            echo "FEED_OWNER=$(cast call "$feed" 'owner()(address)' --rpc-url "$RPC_URL" || true)"
            echo "FEED_LATEST=$(cast call "$feed" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url "$RPC_URL")"
          done

          USDNR_BAL=$(cast call "$USDNR" 'balanceOf(address)(uint256)' "$VAULT" --rpc-url "$RPC_URL")
          echo "USDNR_BALANCE=$USDNR_BAL"
          echo "USDNR_VALUE_IN_SUSDE=$(cast call "$VI" 'calcCanonicalAssetValue(address,uint256,address)(uint256)' "$USDNR" "$USDNR_BAL" "$DENOM" --rpc-url "$RPC_URL")"
          echo "ONE_USDNR_IN_SUSDE=$(cast call "$VI" 'calcCanonicalAssetValue(address,uint256,address)(uint256)' "$USDNR" 1000000000000000000 "$DENOM" --rpc-url "$RPC_URL")"
          echo "ONE_USDN_IN_SUSDE=$(cast call "$VI" 'calcCanonicalAssetValue(address,uint256,address)(uint256)' "$USDN" 1000000000000000000 "$DENOM" --rpc-url "$RPC_URL")"
