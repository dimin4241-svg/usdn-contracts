name: USDN post-bootstrap whole-dollar regression

on:
  push:
    branches:
      - security/usdn-post-bootstrap-coarse-search

permissions:
  contents: read

jobs:
  whole-dollar-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-50dd4b8accae878391b0825885f0632d1e0a1e4c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Verify deterministic whole-dollar post-bootstrap witness
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapWholeDollarRegression -vvvv
