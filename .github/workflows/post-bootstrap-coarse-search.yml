name: USDN post-bootstrap coarse-price search

on:
  push:
    branches:
      - security/usdn-post-bootstrap-coarse-search

permissions:
  contents: read

jobs:
  coarse-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Search whole-dollar post-bootstrap witness
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapCoarseFuzz --fuzz-runs 8192 -vvvv
