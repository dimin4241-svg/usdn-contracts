name: USDN dedicated liquidation liveness validation

on:
  push:
    branches:
      - security/usdn-dedicated-liquidation-liveness-validation

permissions:
  contents: read

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Probe +40s exact invariant revert
        continue-on-error: true
        run: forge test --match-contract TestLiquidationRoundingDedicatedTemporalProbe --match-test test_probe_D40_expectExactInvariantRevert -vv
      - name: Probe +45s exact invariant revert
        continue-on-error: true
        run: forge test --match-contract TestLiquidationRoundingDedicatedTemporalProbe --match-test test_probe_D45_expectExactInvariantRevert -vv
      - name: Probe +50s exact invariant revert
        continue-on-error: true
        run: forge test --match-contract TestLiquidationRoundingDedicatedTemporalProbe --match-test test_probe_D50_expectExactInvariantRevert -vv
      - name: Probe +55s exact invariant revert
        continue-on-error: true
        run: forge test --match-contract TestLiquidationRoundingDedicatedTemporalProbe --match-test test_probe_D55_expectExactInvariantRevert -vv
      - name: Probe +56s exact invariant revert
        continue-on-error: true
        run: forge test --match-contract TestLiquidationRoundingDedicatedTemporalProbe --match-test test_probe_D56_expectExactInvariantRevert -vv
      - name: Probe +57s exact invariant revert
        continue-on-error: true
        run: forge test --match-contract TestLiquidationRoundingDedicatedTemporalProbe --match-test test_probe_D57_expectExactInvariantRevert -vv
      - name: Probe +58s exact invariant revert
        continue-on-error: true
        run: forge test --match-contract TestLiquidationRoundingDedicatedTemporalProbe --match-test test_probe_D58_expectExactInvariantRevert -vv
      - name: Probe +59s exact invariant revert
        continue-on-error: true
        run: forge test --match-contract TestLiquidationRoundingDedicatedTemporalProbe --match-test test_probe_D59_expectExactInvariantRevert -vv
      - name: Run dedicated liquidation liveness regression
        run: forge test --match-contract TestLiquidationRoundingDedicatedLiveness -vvvv
      - name: Run source post-bootstrap rounding regression
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapRegression -vvvv
      - name: Run upstream liquidation regression suite
        run: forge test --match-path 'test/unit/UsdnProtocol/Long/_LiquidatePositions.t.sol' -vvvv
      - name: Run upstream Rebalancer invariant suite
        run: forge test --match-path 'test/unit/UsdnProtocol/Long/_TriggerRebalancer.t.sol' -vvvv
