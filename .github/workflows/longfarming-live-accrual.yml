name: Router allow-revert close history

on:
  push:
    branches:
      - audit/longfarming-post-liquidation-rewards
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read public Blockscout transaction feed
        env:
          ROUTER: "0x49f66B1616865b2a59caECb8352bbf2AC80983e1"
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse

          router=os.environ['ROUTER']
          url=f'https://eth.blockscout.com/api/v2/addresses/{router}/transactions?filter=to'
          seen=0
          pages=0
          while url and pages < 200:
              req=urllib.request.Request(url,headers={'User-Agent':'USDN-router-readonly-audit'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  data=json.loads(r.read())
              pages += 1
              items=data.get('items',[])
              for tx in items:
                  seen += 1
                  raw=(tx.get('raw_input') or tx.get('input') or '').lower()
                  method=tx.get('method')
                  value=int(tx.get('value') or 0)
                  # Print only execute calls carrying ETH; command bytes are decoded later from calldata.
                  if value > 0 and method in ('execute','0x24856bc3','0x3593564c'):
                      print('VALUE_EXECUTE',json.dumps({
                          'hash':tx.get('hash'),'block':tx.get('block'),'timestamp':tx.get('timestamp'),
                          'value':value,'status':tx.get('status'),'method':method,'raw_input':raw
                      },sort_keys=True))
              nxt=data.get('next_page_params')
              if not nxt:
                  break
              url=f'https://eth.blockscout.com/api/v2/addresses/{router}/transactions?'+urllib.parse.urlencode({'filter':'to',**nxt})
          print('SCAN_SUMMARY',json.dumps({'pages':pages,'transactionsSeen':seen}))
          PY
