name: LongFarming event topics

on:
  push:
    branches:
      - audit/longfarming-post-liquidation-rewards
  workflow_dispatch:

jobs:
  topics:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Print event topics
        run: |
          echo "DEPOSIT_TOPIC=$(cast keccak 'Deposit(address,int24,uint256,uint256)')"
          echo "WITHDRAW_TOPIC=$(cast keccak 'Withdraw(address,int24,uint256,uint256)')"
          echo "SLASH_TOPIC=$(cast keccak 'Slash(address,uint256,uint256,int24,uint256,uint256)')"
