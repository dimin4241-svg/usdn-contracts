name: USDN LongFarming current stale positions

on:
  push:
    branches: [security/susdn-live-config]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Reconstruct active farming positions and compare live tick versions
        env:
          FARM: '0xF9D36078A248AF249AA57ae1D5D0c1033d6Bbe27'
          PROTOCOL: '0x656cb8c6d154aad29d8771384089be5b5141f01a'
          RPC_URL: 'https://ethereum-rpc.publicnode.com'
        shell: bash
        run: |
          set -euo pipefail
          export FARM PROTOCOL RPC_URL
          python3 - <<'PY' > /tmp/active.tsv
          import json, os, subprocess
          from urllib.parse import urlencode
          BASE='https://eth.blockscout.com/api/v2'; FARM=os.environ['FARM']
          def get(url):
              return json.loads(subprocess.check_output(['curl','-fsS','--retry','3','--max-time','30',url],text=True))
          def k(s): return subprocess.check_output(['cast','keccak',s],text=True).strip().lower()
          dep=k('Deposit(address,int24,uint256,uint256)'); wd=k('Withdraw(address,int24,uint256,uint256)'); sl=k('Slash(address,uint256,uint256,int24,uint256,uint256)')
          def words(data):
              h=data[2:]; return [int(h[i:i+64],16) for i in range(0,len(h),64) if h[i:i+64]]
          def s24(x):
              v=x&((1<<24)-1); return v-(1<<24) if v&(1<<23) else v
          active={}; params={}
          while True:
              url=f'{BASE}/addresses/{FARM}/logs'+(('?'+urlencode(params)) if params else '')
              o=get(url)
              for x in o.get('items',[]):
                  if not x.get('topics'): continue
                  t=x['topics'][0].lower(); w=words(x['data'])
                  if t==dep:
                      key=(s24(w[0]),w[1],w[2])
                      active[key]={'owner':'0x'+x['topics'][1][-40:],'depositBlock':int(x['block_number']),'tx':x.get('transaction_hash')}
                  elif t==wd:
                      active.pop((s24(w[0]),w[1],w[2]),None)
                  elif t==sl:
                      active.pop((s24(w[2]),w[3],w[4]),None)
              params=o.get('next_page_params')
              if not params: break
          for (tick,ver,idx),m in sorted(active.items()):
              print(tick,ver,idx,m['owner'],m['depositBlock'],m['tx'],sep='\t')
          PY

          echo "ACTIVE_COUNT=$(wc -l < /tmp/active.tsv)"
          echo 'CURRENT_POSITIONS_BEGIN'
          stale=0
          stale_pending=0
          while IFS=$'\t' read -r tick ver idx owner depblock tx; do
            cur=$(cast call "$PROTOCOL" 'getTickVersion(int24)(uint256)' "$tick" --rpc-url "$RPC_URL" | awk '{print $1}')
            pending=$(cast call "$FARM" 'pendingRewards(int24,uint256,uint256)(uint256)' "$tick" "$ver" "$idx" --rpc-url "$RPC_URL" | awk '{print $1}')
            info=$(cast call "$FARM" 'getPositionInfo(int24,uint256,uint256)((address,int24,uint256,uint256,uint256,uint128))' "$tick" "$ver" "$idx" --rpc-url "$RPC_URL")
            liquidated=false
            if [ "$cur" != "$ver" ]; then
              liquidated=true
              stale=$((stale+1))
              if [ "$pending" != "0" ]; then stale_pending=$((stale_pending+1)); fi
            fi
            echo "POSITION tick=$tick storedVersion=$ver currentVersion=$cur index=$idx owner=$owner depositBlock=$depblock liquidated=$liquidated pending=$pending info=$info tx=$tx"
          done < /tmp/active.tsv
          echo 'CURRENT_POSITIONS_END'
          echo "STALE_COUNT=$stale"
          echo "STALE_WITH_PENDING=$stale_pending"

          echo '--- live global state ---'
          cast call "$FARM" 'getPositionsCount()(uint256)' --rpc-url "$RPC_URL"
          cast call "$FARM" 'getTotalShares()(uint256)' --rpc-url "$RPC_URL"
          REWARD=$(cast call "$FARM" 'REWARD_TOKEN()(address)' --rpc-url "$RPC_URL")
          echo "REWARD_TOKEN=$REWARD"
          cast call "$REWARD" 'balanceOf(address)(uint256)' "$FARM" --rpc-url "$RPC_URL"
