name: USDN mainnet liquidation history

on:
  push:
    branches:
      - security/usdn-mainnet-history

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    env:
      FOUNDRY_DISABLE_NIGHTLY_WARNING: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Probe archive state before real two-tick liquidation
        shell: bash
        run: |
          set -u
          PROTOCOL=0x656cB8C6d154Aad29d8771384089be5B5141f01a
          BEFORE=25240928
          AFTER=25240929

          one () {
            local RPC=$1 LABEL=$2 SIG=$3 BLOCK=$4
            local OUT
            OUT=$(timeout 10s cast call "$PROTOCOL" "$SIG" --block "$BLOCK" --rpc-url "$RPC" 2>&1 || true)
            OUT=${OUT//$'\n'/ }
            OUT=${OUT:0:600}
            if [ -z "$OUT" ]; then OUT='<empty/timeout>'; fi
            echo "::notice title=${LABEL}::${OUT}"
          }

          for ENTRY in \
            'rpcfree|https://rpcfree.com/ethereum-rpc' \
            'blockreq|https://ethereum-rpc.blockreq.com/v1/rpc/public'
          do
            NAME=${ENTRY%%|*}
            RPC=${ENTRY#*|}
            one "$RPC" "$NAME-before-lastPrice" 'getLastPrice()(uint128)' "$BEFORE"
            one "$RPC" "$NAME-before-totalExpo" 'getTotalExpo()(uint256)' "$BEFORE"
            one "$RPC" "$NAME-before-balanceLong" 'getBalanceLong()(uint256)' "$BEFORE"
            one "$RPC" "$NAME-before-balanceVault" 'getBalanceVault()(uint256)' "$BEFORE"
            one "$RPC" "$NAME-before-positions" 'getTotalLongPositions()(uint256)' "$BEFORE"
            one "$RPC" "$NAME-before-highestTick" 'getHighestPopulatedTick()(int24)' "$BEFORE"
            one "$RPC" "$NAME-before-accumulator" 'getLiqMultiplierAccumulator()((uint256,uint256))' "$BEFORE"
            one "$RPC" "$NAME-after-totalExpo" 'getTotalExpo()(uint256)' "$AFTER"
            one "$RPC" "$NAME-after-balanceLong" 'getBalanceLong()(uint256)' "$AFTER"
            one "$RPC" "$NAME-after-positions" 'getTotalLongPositions()(uint256)' "$AFTER"
            one "$RPC" "$NAME-after-highestTick" 'getHighestPopulatedTick()(int24)' "$AFTER"
          done
