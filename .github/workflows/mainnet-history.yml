name: USDN mainnet liquidation history

on:
  push:
    branches:
      - security/usdn-mainnet-history

permissions:
  contents: read

jobs:
  history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - name: Probe archive state before real two-tick liquidation
        shell: bash
        run: |
          set -u
          PROTOCOL=0x656cB8C6d154Aad29d8771384089be5B5141f01a
          TWO_BLOCK=25240929
          OLD_BLOCK=22638958

          call_at () {
            local RPC=$1 SIG=$2 BLOCK=$3
            timeout 12s cast call "$PROTOCOL" "$SIG" --block "$BLOCK" --rpc-url "$RPC" 2>&1 || true
          }

          dump_state () {
            local RPC=$1 BLOCK=$2
            echo "-- state block $BLOCK"
            echo -n 'lastPrice='; call_at "$RPC" 'getLastPrice()(uint128)' "$BLOCK"
            echo -n 'totalExpo='; call_at "$RPC" 'getTotalExpo()(uint256)' "$BLOCK"
            echo -n 'balanceLong='; call_at "$RPC" 'getBalanceLong()(uint256)' "$BLOCK"
            echo -n 'balanceVault='; call_at "$RPC" 'getBalanceVault()(uint256)' "$BLOCK"
            echo -n 'positions='; call_at "$RPC" 'getTotalLongPositions()(uint256)' "$BLOCK"
            echo -n 'highestTick='; call_at "$RPC" 'getHighestPopulatedTick()(int24)' "$BLOCK"
            echo -n 'accumulator='; call_at "$RPC" 'getLiqMultiplierAccumulator()((uint256,uint256))' "$BLOCK"
          }

          for RPC in \
            https://rpcfree.com/ethereum-rpc \
            https://ethereum-rpc.blockreq.com/v1/rpc/public
          do
            echo "===== RPC $RPC ====="
            echo '=== immediately before real TWO-TICK tx ==='
            dump_state "$RPC" $((TWO_BLOCK-1))
            echo '=== after real TWO-TICK tx block ==='
            dump_state "$RPC" $TWO_BLOCK
            echo '=== older control block ==='
            dump_state "$RPC" $((OLD_BLOCK-1))
          done
