name: USDN LongFarming production read-only state

on:
  push:
    branches:
      - security/usdn-long-farming-zero-share-backlog

permissions:
  contents: read

jobs:
  read-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Read production LongFarming and campaign 20 state
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          LONG_FARMING: '0xF9D36078A248AF249AA57ae1D5D0c1033d6Bbe27'
          FARMING_RANGE: '0x7d85C0905a6E1Ab5837a0b57cD94A419d3a77523'
        run: |
          set -euxo pipefail
          cast block-number --rpc-url "$RPC_URL"
          cast call "$LONG_FARMING" 'CAMPAIGN_ID()(uint256)' --rpc-url "$RPC_URL"
          cast call "$LONG_FARMING" 'REWARDS_PROVIDER()(address)' --rpc-url "$RPC_URL"
          cast call "$LONG_FARMING" 'getTotalShares()(uint256)' --rpc-url "$RPC_URL"
          cast call "$LONG_FARMING" 'getPositionsCount()(uint256)' --rpc-url "$RPC_URL"
          cast call "$LONG_FARMING" 'getAccRewardPerShare()(uint256)' --rpc-url "$RPC_URL"
          cast call "$LONG_FARMING" 'getLastRewardBlock()(uint256)' --rpc-url "$RPC_URL"
          cast call "$FARMING_RANGE" 'userInfo(uint256,address)(uint256,uint256)' 20 "$LONG_FARMING" --rpc-url "$RPC_URL"
          cast call "$FARMING_RANGE" 'campaignInfo(uint256)(address,address,uint256,uint256,uint256,uint256,uint256)' 20 --rpc-url "$RPC_URL"
          cast call "$FARMING_RANGE" 'currentRewardPerBlock(uint256)(uint256)' 20 --rpc-url "$RPC_URL"
          cast call "$FARMING_RANGE" 'currentEndBlock(uint256)(uint256)' 20 --rpc-url "$RPC_URL"
          cast call "$FARMING_RANGE" 'rewardInfoLen(uint256)(uint256)' 20 --rpc-url "$RPC_URL"
          cast call "$FARMING_RANGE" 'pendingReward(uint256,address)(uint256)' 20 "$LONG_FARMING" --rpc-url "$RPC_URL"

          echo '=== campaign 20 reward schedule ==='
          for i in 0 1 2 3 4 5 6; do
            echo "rewardInfo[$i]"
            cast call "$FARMING_RANGE" 'campaignRewardInfo(uint256,uint256)(uint256,uint256)' 20 "$i" --rpc-url "$RPC_URL"
          done

          echo '=== schedule boundary block timestamps ==='
          START=$(cast call "$FARMING_RANGE" 'campaignInfo(uint256)(address,address,uint256,uint256,uint256,uint256,uint256)' 20 --rpc-url "$RPC_URL" | sed -n '3p' | awk '{print $1}')
          echo "campaignStartBlock=$START"
          cast block "$START" --field timestamp --rpc-url "$RPC_URL"
          for i in 0 1 2 3 4 5 6; do
            END=$(cast call "$FARMING_RANGE" 'campaignRewardInfo(uint256,uint256)(uint256,uint256)' 20 "$i" --rpc-url "$RPC_URL" | sed -n '1p' | awk '{print $1}')
            echo "rewardInfo[$i].endBlock=$END"
            cast block "$END" --field timestamp --rpc-url "$RPC_URL"
          done
