name: Recent Lido rebase size read-only
on:
  workflow_dispatch:
  push:
    branches: [security/susdn-live-config]
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read official latest Lido APR
        shell: bash
        run: |
          set -euo pipefail
          RAW=$(curl -fsSL --max-time 30 'https://eth-api.lido.fi/v1/protocol/steth/apr/last')
          echo "raw=$RAW"
          python3 - "$RAW" <<'PY'
          import json, sys
          x=json.loads(sys.argv[1])
          print('parsed_json=', json.dumps(x, sort_keys=True))
          # Be tolerant to API envelope changes and extract the first numeric APR-like field.
          def walk(o, path=''):
              if isinstance(o, dict):
                  for k,v in o.items():
                      p=f'{path}.{k}' if path else k
                      if isinstance(v,(int,float)) and 'apr' in k.lower():
                          print(f'apr_field {p}={v}')
                      walk(v,p)
              elif isinstance(o,list):
                  for i,v in enumerate(o): walk(v,f'{path}[{i}]')
          walk(x)
          PY