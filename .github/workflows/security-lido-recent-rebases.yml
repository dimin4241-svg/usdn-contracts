name: Recent Lido rebase size read-only
on:
  workflow_dispatch:
  push:
    branches: [security/susdn-live-config]
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - shell: bash
        env:
          RPC: https://ethereum-rpc.publicnode.com
          STETH: '0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess, time
          rpc = 'https://ethereum-rpc.publicnode.com'
          steth = '0xae7ab96520DE3A18E5e111B5EaAb095312D7fE84'
          sig = 'TokenRebased(uint256,uint256,uint256,uint256,uint256,uint256,uint256)'
          topic0 = subprocess.check_output(['cast','keccak',sig], text=True).strip()
          latest = int(subprocess.check_output(['cast','block-number','--rpc-url',rpc], text=True).strip())
          start = max(0, latest - 55_000)  # roughly the last week
          events = []
          for s in range(start, latest + 1, 7500):
              e = min(latest, s + 7499)
              raw = subprocess.check_output([
                  'cast','logs','--rpc-url',rpc,'--from-block',str(s),'--to-block',str(e),
                  '--address',steth,topic0,'--json'
              ], text=True)
              events.extend(json.loads(raw))
          print(f'latest_block={latest} events={len(events)} topic0={topic0}')
          for ev in events[-10:]:
              topics = ev['topics']
              report_ts = int(topics[1], 16)
              data = ev['data'][2:]
              vals = [int(data[i:i+64],16) for i in range(0,len(data),64)]
              if len(vals) < 6:
                  continue
              time_elapsed, pre_shares, pre_eth, post_shares, post_eth, fees = vals[:6]
              pre_rate = pre_eth * 10**18 // pre_shares
              post_rate = post_eth * 10**18 // post_shares
              delta = post_rate - pre_rate
              bps_x1e6 = delta * 10_000_000_000 // pre_rate  # 1 bp = 1,000,000 here
              block_num = ev.get('blockNumber') or ev.get('block_number')
              if isinstance(block_num,str):
                  block_num = int(block_num,16) if block_num.startswith('0x') else int(block_num)
              iso = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime(report_ts))
              print(f'block={block_num} report_ts={report_ts} iso={iso} elapsed={time_elapsed} pre_rate={pre_rate} post_rate={post_rate} delta_wei={delta} delta_bps={bps_x1e6/1_000_000:.6f}')
          PY
