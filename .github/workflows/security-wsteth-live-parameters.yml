name: wstETH skew live parameters
on:
  workflow_dispatch:
  push:
    branches: [security/susdn-live-config]
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - shell: bash
        env:
          RPC: https://ethereum-rpc.publicnode.com
          PROTOCOL: '0x656cB8C6d154Aad29d8771384089be5B5141f01a'
        run: |
          set -euo pipefail
          ASSET=$(cast call "$PROTOCOL" 'getAsset()(address)' --rpc-url "$RPC")
          ORACLE=$(cast call "$PROTOCOL" 'getOracleMiddleware()(address)' --rpc-url "$RPC")
          echo "asset=$ASSET"
          echo "oracle=$ORACLE"
          echo "maxLeverage=$(cast call "$PROTOCOL" 'getMaxLeverage()(uint256)' --rpc-url "$RPC")"
          echo "minLeverage=$(cast call "$PROTOCOL" 'getMinLeverage()(uint256)' --rpc-url "$RPC")"
          echo "minLongPosition=$(cast call "$PROTOCOL" 'getMinLongPosition()(uint256)' --rpc-url "$RPC")"
          echo "positionFeeBps=$(cast call "$PROTOCOL" 'getPositionFeeBps()(uint16)' --rpc-url "$RPC")"
          echo "closeExpoImbalanceLimitBps=$(cast call "$PROTOCOL" 'getCloseExpoImbalanceLimitBps()(int256)' --rpc-url "$RPC")"
          echo "rebalancerCloseExpoImbalanceLimitBps=$(cast call "$PROTOCOL" 'getRebalancerCloseExpoImbalanceLimitBps()(int256)' --rpc-url "$RPC")"
          echo "longImbalanceTargetBps=$(cast call "$PROTOCOL" 'getLongImbalanceTargetBps()(int256)' --rpc-url "$RPC")"
          echo "lowLatencyValidatorDeadline=$(cast call "$PROTOCOL" 'getLowLatencyValidatorDeadline()(uint128)' --rpc-url "$RPC")"
          echo "onChainValidatorDeadline=$(cast call "$PROTOCOL" 'getOnChainValidatorDeadline()(uint128)' --rpc-url "$RPC")"
          echo "balanceVault=$(cast call "$PROTOCOL" 'getBalanceVault()(uint256)' --rpc-url "$RPC")"
          echo "pendingBalanceVault=$(cast call "$PROTOCOL" 'getPendingBalanceVault()(int256)' --rpc-url "$RPC")"
          echo "balanceLong=$(cast call "$PROTOCOL" 'getBalanceLong()(uint256)' --rpc-url "$RPC")"
          echo "totalExpo=$(cast call "$PROTOCOL" 'getTotalExpo()(uint256)' --rpc-url "$RPC")"
          echo "lastPrice=$(cast call "$PROTOCOL" 'getLastPrice()(uint128)' --rpc-url "$RPC")"
          echo "lastUpdateTimestamp=$(cast call "$PROTOCOL" 'getLastUpdateTimestamp()(uint128)' --rpc-url "$RPC")"
          echo "protocolAssetBalance=$(cast call "$ASSET" 'balanceOf(address)(uint256)' "$PROTOCOL" --rpc-url "$RPC")"
          echo "stEthPerToken=$(cast call "$ASSET" 'stEthPerToken()(uint256)' --rpc-url "$RPC")"
          echo "validationDelay=$(cast call "$ORACLE" 'getValidationDelay()(uint256)' --rpc-url "$RPC")"
          echo "lowLatencyDelay=$(cast call "$ORACLE" 'getLowLatencyDelay()(uint16)' --rpc-url "$RPC")"
