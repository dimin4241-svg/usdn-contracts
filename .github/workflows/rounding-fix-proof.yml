name: USDN rounding fix proof

on:
  push:
    branches:
      - security/usdn-rounding-fix-clean

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-50dd4b8accae878391b0825885f0632d1e0a1e4c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Exact green-side A/B symmetry proof
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapWholeDollarFixSymmetry -vvvv
      - name: Whole-dollar post-bootstrap green regression
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapWholeDollarFixValidation -vvvv
      - name: Post-bootstrap accounting regression
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapFixAccounting -vvvv
      - name: Pending-withdrawal liveness regression
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapFixImpact -vvvv
      - name: Existing ordinary-only regression
        run: forge test --match-contract TestLiquidationRoundingOrdinaryPositions -vvvv
      - name: Existing production-config regression
        run: forge test --match-contract TestLiquidationRoundingProductionInvariant -vvvv
      - name: Upstream Rebalancer invariant suite
        run: forge test --match-path 'test/unit/UsdnProtocol/Long/_TriggerRebalancer.t.sol' -vvvv
