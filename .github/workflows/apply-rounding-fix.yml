name: Apply USDN rounding fix

on:
  push:
    branches:
      - security/usdn-rounding-fix

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/usdn-rounding-fix
          fetch-depth: 0

      - name: Apply accumulator-consistent liquidation reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/UsdnProtocol/libraries/UsdnProtocolLongLibrary.sol")
          text = path.read_text()

          start_marker = "        // transfer remaining collateral to vault or pay bad debt\n        data.tempLongBalance -= effects.remainingCollateral;\n        data.tempVaultBalance += effects.remainingCollateral;\n"
          old_comment = "        // `_tickValue` rounds every liquidated tick independently."
          next_marker = "\n    }\n\n    /**\n     * @notice Checks and reverts if the position's trading exposure exceeds the imbalance limits."

          start = text.index(start_marker)
          if old_comment not in text[start:]:
              if "Only reconcile when that inconsistency would make the long trading exposure negative." in text[start:]:
                  print("accumulator reconciliation already present")
                  raise SystemExit(0)
              raise SystemExit("bounded-fix marker not found")
          end = text.index(next_marker, start)

          replacement = (
              "        // transfer remaining collateral to vault or pay bad debt\n"
              "        data.tempLongBalance -= effects.remainingCollateral;\n"
              "        data.tempVaultBalance += effects.remainingCollateral;\n\n"
              "        // Each liquidated tick is valued independently with integer arithmetic. Summing those\n"
              "        // rounded values can make the temporary long balance inconsistent with the aggregate\n"
              "        // exposure/accumulator state after the ticks have been removed.\n"
              "        //\n"
              "        // Only reconcile when that inconsistency would make the long trading exposure negative.\n"
              "        // The liquidation multiplier before the batch is proportional to\n"
              "        // `longTradingExpo / accumulator`. Removing positions should not change that multiplier\n"
              "        // at the same asset price, so derive the representable trading exposure of the remaining\n"
              "        // aggregate state from the updated accumulator instead of guessing a wei tolerance.\n"
              "        int256 totalExpo = s._totalExpo.toInt256();\n"
              "        if (data.tempLongBalance > totalExpo) {\n"
              "            uint256 remainingTradingExpo;\n"
              "            if (s._totalExpo != 0) {\n"
              "                remainingTradingExpo =\n"
              "                    s._liqMultiplierAccumulator.mul(data.longTradingExpo).div(data.accumulator);\n"
              "                if (remainingTradingExpo > s._totalExpo) {\n"
              "                    revert IUsdnProtocolErrors.UsdnProtocolInvalidLongExpo();\n"
              "                }\n"
              "            }\n\n"
              "            int256 reconciledLongBalance = (s._totalExpo - remainingTradingExpo).toInt256();\n"
              "            int256 reconciliation = data.tempLongBalance - reconciledLongBalance;\n"
              "            data.tempLongBalance = reconciledLongBalance;\n"
              "            data.tempVaultBalance += reconciliation;\n"
              "            effects.remainingCollateral += reconciliation;\n"
              "        }\n"
          )

          path.write_text(text[:start] + replacement + text[end:])
          print("replaced heuristic bound with accumulator reconciliation")
          PY

      - name: Commit source fix
        run: |
          if git diff --quiet -- src/UsdnProtocol/libraries/UsdnProtocolLongLibrary.sol; then
            echo "No source change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UsdnProtocol/libraries/UsdnProtocolLongLibrary.sol
          git commit -m "fix: preserve liquidation multiplier across rounded batches"
          git push origin HEAD:security/usdn-rounding-fix
