name: USDN LongFarming sample liquidation correlation

on:
  push:
    branches: [security/susdn-live-config]
  workflow_dispatch:

jobs:
  correlate:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Correlate verified mainnet Slash events with LiquidatedTick logs
        env:
          BLOCKSCOUT: https://eth.blockscout.com/api
          PROTOCOL: '0x656cb8c6d154aad29d8771384089be5b5141f01a'
          DEPLOYMENT_BLOCK: '21681344'
        shell: bash
        run: |
          set -euo pipefail
          export BLOCKSCOUT PROTOCOL DEPLOYMENT_BLOCK
          python3 - <<'PY'
          import json, os, subprocess, time
          from urllib.parse import urlencode

          BASE=os.environ['BLOCKSCOUT']; PROTOCOL=os.environ['PROTOCOL']; DEPLOY=int(os.environ['DEPLOYMENT_BLOCK'])
          LIQ=subprocess.check_output(['cast','keccak','LiquidatedTick(int24,uint256,uint256,uint256,int256)'],text=True).strip().lower()

          def get_json(url):
              last=None
              for attempt in range(8):
                  try:
                      out=subprocess.check_output(['curl','-fsS','--retry','2','--retry-delay','1','--max-time','30','-H','accept: application/json',url],text=True,stderr=subprocess.STDOUT,timeout=35)
                      return json.loads(out)
                  except Exception as e:
                      last=e; time.sleep(min(3,0.5*(attempt+1)))
              raise last

          def logs(a,b):
              q=urlencode({'module':'logs','action':'getLogs','fromBlock':a,'toBlock':b,'address':PROTOCOL,'topic0':LIQ})
              o=get_json(BASE+'?'+q); r=o.get('result',[])
              if isinstance(r,str): return []
              return r

          def s24(t):
              v=int(t,16)&((1<<24)-1)
              return v-(1<<24) if v&(1<<23) else v

          samples=[
              # verified from complete V2 LongFarming log reconstruction:
              # tick, version, index, slashBlock, notifierRewards, ownerRewards, slashTx
              (82000,0,0,21758975,0,55350465282065918760293,'0xec531ddc63988894a6e5c3d4718b5360d33bd3352e3a1718886eae81739c4dfa'),
              (79200,0,0,21763319,32228679786148368231483,75200252834346192540127,'0xa7c268ea30aa04029d8efac26efd06b0ddea2a1cb2bfd50b64b8abb2e48ef65e'),
              (78100,0,5,21943409,32749909741282993114010,294749187671546938026092,'0x705d64defcdf6cadecec09f205a0115838c15dc6684b955c23e56ab8084f8f3d'),
          ]

          for tick,ver,idx,sb,nr,orr,stx in samples:
              print('SAMPLE_BEGIN tick',tick,'version',ver,'index',idx,'slashBlock',sb,'slashTx',stx)
              print('SLASH_EXACT notifierRewards',nr,'ownerRewards',orr,'totalRewards',nr+orr)
              found=None
              # Search backwards in contiguous windows to avoid API caps.
              end=sb; step=5000; searched=0
              while end>=DEPLOY and searched<2500000 and found is None:
                  start=max(DEPLOY,end-step+1)
                  rr=logs(start,end)
                  matches=[]
                  for x in rr:
                      ts=x.get('topics',[])
                      if len(ts)>=3 and s24(ts[1])==tick and int(ts[2],16)==ver:
                          matches.append(x)
                  print('WINDOW',start,end,'raw',len(rr),'matches',len(matches))
                  if matches:
                      matches.sort(key=lambda x:int(x['blockNumber'],16))
                      found=matches[-1]
                      break
                  searched += end-start+1
                  end=start-1
                  # expand but keep each request modest enough for Blockscout result limits
                  if searched>=20000: step=20000
              if found:
                  lb=int(found['blockNumber'],16)
                  print('LIQ_EXACT block',lb,'delayBlocks',sb-lb,'tx',found.get('transactionHash'),
                        'tick',s24(found['topics'][1]),'oldVersion',int(found['topics'][2],16))
              else:
                  print('LIQ_NOT_FOUND searchedBlocks',searched)
              print('SAMPLE_END')
          PY
