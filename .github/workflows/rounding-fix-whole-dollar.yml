name: USDN rounding fix whole-dollar validation

on:
  push:
    branches:
      - security/usdn-rounding-fix-whole-dollar

permissions:
  contents: read

jobs:
  validate-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-50dd4b8accae878391b0825885f0632d1e0a1e4c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Whole-dollar post-bootstrap red-to-green witness
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapWholeDollarFix -vvvv
      - name: Preserve upstream Rebalancer invariant
        run: forge test --match-test test_RevertWhen_triggerRebalancerWithTotalExpoBelowLongBalance -vvvv
