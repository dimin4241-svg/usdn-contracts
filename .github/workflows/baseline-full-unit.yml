name: Baseline USDN unit suite

on:
  push:
    branches:
      - security/usdn-baseline-full-unit

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci && forge soldeer install

      - name: Build upstream test_utils
        run: cargo build --release

      - name: Run full USDN protocol unit suite
        run: forge test --match-path 'test/unit/UsdnProtocol/**/*.t.sol' -vv
