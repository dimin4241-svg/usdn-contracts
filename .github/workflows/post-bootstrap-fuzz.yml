name: USDN post-bootstrap ordinary regression

on:
  push:
    branches:
      - security/usdn-post-bootstrap-fuzz

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Run deterministic post-bootstrap accounting regression
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapRegression -vvvv
      - name: Run deterministic post-bootstrap withdrawal impact regression
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapImpact -vvvv
