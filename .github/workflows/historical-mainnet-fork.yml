name: USDN historical mainnet reachability

on:
  push:
    branches:
      - security/usdn-historical-mainnet-fork

permissions:
  contents: read

jobs:
  historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - run: forge test --via-ir --match-path 'test/integration/UsdnProtocol/Historical*' -vvv
