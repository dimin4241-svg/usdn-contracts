name: sUSDN policies and feed
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/security-susdn-policy-feed.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect live policies and feed
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          VAULT: '0xF67e2dC041b8A3c39d066037d29f500757b1e886'
          FEED: '0xd5004C5D3017862839e83981b110f27EE7B36EAa'
        run: |
          set -euo pipefail
          ACCESSOR=$(cast call "$VAULT" 'getAccessor()(address)' --rpc-url "$RPC_URL")
          PM=$(cast call "$ACCESSOR" 'getPolicyManager()(address)' --rpc-url "$RPC_URL")
          echo "ACCESSOR=$ACCESSOR"
          echo "POLICY_MANAGER=$PM"
          POLICIES_RAW=$(cast call "$PM" 'getEnabledPoliciesForFund(address)(address[])' "$ACCESSOR" --rpc-url "$RPC_URL")
          echo "ENABLED_POLICIES=$POLICIES_RAW"
          echo "$POLICIES_RAW" | grep -oE '0x[0-9A-Fa-f]{40}' | while read -r p; do
            echo "--- POLICY=$p ---"
            echo "IDENTIFIER=$(cast call "$p" 'identifier()(string)' --rpc-url "$RPC_URL" || true)"
            echo "HOOKS=$(cast call "$p" 'implementedHooks()(uint8[])' --rpc-url "$RPC_URL" || true)"
          done

          echo "=== USDN FEED ==="
          echo "CODEHASH=$(cast codehash "$FEED" --rpc-url "$RPC_URL")"
          code=$(cast code "$FEED" --rpc-url "$RPC_URL")
          echo "CODE_BYTES=$(((${#code}-2)/2))"
          echo "LATEST=$(cast call "$FEED" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url "$RPC_URL")"
          for sig in \
            'getPrice()(uint256)' \
            'getPrice()(int256)' \
            'price()(uint256)' \
            'latestAnswer()(int256)' \
            'decimals()(uint8)' \
            'USDN()(address)' \
            'usdn()(address)' \
            'protocol()(address)' \
            'getUsdnProtocol()(address)' \
            'getOracleMiddleware()(address)' \
            'owner()(address)' \
            'admin()(address)' \
            'implementation()(address)' \
            'asset()(address)' \
            'BASE_FEED()(address)'; do
            echo "$sig => $(cast call "$FEED" "$sig" --rpc-url "$RPC_URL" 2>/dev/null || echo REVERT)"
          done
          echo "EIP1967_IMPL=$(cast storage "$FEED" 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc --rpc-url "$RPC_URL")"
          echo "EIP1967_ADMIN=$(cast storage "$FEED" 0xb53127684a568b3173ae13b9f8a6016e019e2aA71e19276e2e0c3fdb1b6103 --rpc-url "$RPC_URL" || true)"
