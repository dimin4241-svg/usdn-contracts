name: sUSDN policies and feed
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/security-susdn-policy-feed.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect redemption allowlist and USDN feed
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          VAULT: '0xF67e2dC041b8A3c39d066037d29f500757b1e886'
          FEED: '0xd5004C5D3017862839e83981b110f27EE7B36EAa'
          REDEMPTION_POLICY: '0x823ca839DA344DA59D517b84ce3baB9FFc9f54eE'
          SUSDE: '0x9D39A5DE30e57443BfF2A8307A4256c8797A3497'
          USDN: '0xde17a000BA631c5d7c2Bd9FB692EFeA52D90DEE2'
          USDT: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
          USDNR: '0x82957d600963Ae0C529c3819Ac7C349c4D49269B'
        run: |
          set -euo pipefail
          ACCESSOR=$(cast call "$VAULT" 'getAccessor()(address)' --rpc-url "$RPC_URL")
          PM=$(cast call "$ACCESSOR" 'getPolicyManager()(address)' --rpc-url "$RPC_URL")
          echo "ACCESSOR=$ACCESSOR"
          echo "POLICY_MANAGER=$PM"
          echo "ENABLED_POLICIES=$(cast call "$PM" 'getEnabledPoliciesForFund(address)(address[])' "$ACCESSOR" --rpc-url "$RPC_URL")"

          echo "=== SPECIFIC REDEMPTION POLICY ==="
          REGISTRY=$(cast call "$REDEMPTION_POLICY" 'getAddressListRegistry()(address)' --rpc-url "$RPC_URL")
          LISTS=$(cast call "$REDEMPTION_POLICY" 'getListIdsForFund(address)(uint256[])' "$ACCESSOR" --rpc-url "$RPC_URL")
          echo "ADDRESS_LIST_REGISTRY=$REGISTRY"
          echo "REDEMPTION_LIST_IDS=$LISTS"
          for asset in "$SUSDE" "$USDN" "$USDT" "$USDNR"; do
            echo "ASSET=$(cast call "$asset" 'symbol()(string)' --rpc-url "$RPC_URL") $asset ALLOWED=$(cast call "$REGISTRY" 'isInSomeOfLists(uint256[],address)(bool)' "$LISTS" "$asset" --rpc-url "$RPC_URL")"
          done
          echo "$LISTS" | grep -oE '[0-9]+' | while read -r id; do
            echo "LIST=$id OWNER=$(cast call "$REGISTRY" 'getListOwner(uint256)(address)' "$id" --rpc-url "$RPC_URL") UPDATE_TYPE=$(cast call "$REGISTRY" 'getListUpdateType(uint256)(uint8)' "$id" --rpc-url "$RPC_URL")"
          done

          echo "=== USDN FEED ==="
          echo "CODEHASH=$(cast codehash "$FEED" --rpc-url "$RPC_URL")"
          code=$(cast code "$FEED" --rpc-url "$RPC_URL")
          echo "CODE_BYTES=$(((${#code}-2)/2))"
          echo "LATEST=$(cast call "$FEED" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url "$RPC_URL")"
          echo '--- SELECTORS ---'
          cast selectors "$code" || true
          echo '--- 4BYTE LOOKUPS ---'
          cast selectors "$code" | awk '{print $1}' | sort -u | while read -r sel; do
            [[ -z "$sel" ]] && continue
            echo "$sel => $(cast 4byte "$sel" 2>/dev/null | head -5 | tr '\n' ';' || true)"
          done
          echo "EIP1967_IMPL=$(cast storage "$FEED" 0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc --rpc-url "$RPC_URL")"
