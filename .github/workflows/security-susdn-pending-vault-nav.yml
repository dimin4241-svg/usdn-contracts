name: sUSDN pending vault NAV fork probe

on:
  workflow_dispatch: {}
  push:
    branches:
      - security/usdn-susdn-enzyme
    paths:
      - test/security/SusdnPendingVaultNav.t.sol
      - .github/workflows/security-susdn-pending-vault-nav.yml

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RPC_URL: https://ethereum-rpc.publicnode.com
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install dependencies
        run: forge soldeer install
      - name: Run pending deposit and withdrawal probes
        run: forge test --match-contract SusdnPendingVaultNavTest -vvvv
