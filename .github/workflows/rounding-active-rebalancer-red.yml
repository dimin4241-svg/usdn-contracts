name: USDN v1.0.0 active Rebalancer red proof

on:
  push:
    branches:
      - security/usdn-rounding-active-rebalancer-red

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-50dd4b8accae878391b0825885f0632d1e0a1e4c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Same success expectation on vulnerable v1.0.0
        run: forge test --match-contract TestLiquidationRoundingActiveRebalancerFixValidation -vvvv
