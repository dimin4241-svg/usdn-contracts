name: USDN post-bootstrap three-tick impact

on:
  push:
    branches:
      - security/usdn-post-bootstrap-three-tick-impact
  workflow_dispatch:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-50dd4b8accae878391b0825885f0632d1e0a1e4c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Three-tick user-impact proof
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapThreeTickImpact -vvvv
