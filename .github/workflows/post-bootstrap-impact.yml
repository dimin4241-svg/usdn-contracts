name: USDN post-bootstrap escrow impact

on:
  push:
    branches:
      - security/usdn-post-bootstrap-impact

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Run post-bootstrap escrow impact regression
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapImpact -vvvv
