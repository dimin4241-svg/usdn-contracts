name: USDN fresh-Pyth user-action impact validation

on:
  push:
    branches:
      - security/usdn-rounding-impact-fresh-pyth-validation

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Run fresh-Pyth user-action impact regression
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapImpact -vvvv
      - name: Run upstream liquidation regression suite
        run: forge test --match-path 'test/unit/UsdnProtocol/Long/_LiquidatePositions.t.sol' -vvvv
      - name: Run upstream Rebalancer invariant suite
        run: forge test --match-path 'test/unit/UsdnProtocol/Long/_TriggerRebalancer.t.sol' -vvvv
