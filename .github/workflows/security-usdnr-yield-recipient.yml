name: USDnr yield recipient proof
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/security-usdnr-yield-recipient.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect USDnr accrued yield destination
        env:
          RPC: https://ethereum-rpc.publicnode.com
          USDN: '0xde17a000BA631c5d7c2Bd9FB692EFeA52D90DEE2'
          USDNR: '0x82957d600963Ae0C529c3819Ac7C349c4D49269B'
          SUSDN: '0xF67e2dC041b8A3c39d066037d29f500757b1e886'
        run: |
          set -euo pipefail
          D=$(cast call "$USDN" 'divisor()(uint256)' --rpc-url "$RPC" | awk '{print $1}')
          SHARES=$(cast call "$USDN" 'sharesOf(address)(uint256)' "$USDNR" --rpc-url "$RPC" | awk '{print $1}')
          BAL=$(cast call "$USDN" 'balanceOf(address)(uint256)' "$USDNR" --rpc-url "$RPC" | awk '{print $1}')
          SUPPLY=$(cast call "$USDNR" 'totalSupply()(uint256)' --rpc-url "$RPC" | awk '{print $1}')
          RESERVE=$(cast call "$USDNR" 'RESERVE()(uint256)' --rpc-url "$RPC" | awk '{print $1}')
          RECIPIENT=$(cast call "$USDNR" 'getYieldRecipient()(address)' --rpc-url "$RPC")
          OWNER=$(cast call "$USDNR" 'owner()(address)' --rpc-url "$RPC")
          ROUND_DOWN=$(( SHARES / D ))
          YIELD=$(( ROUND_DOWN > SUPPLY + RESERVE ? ROUND_DOWN - SUPPLY - RESERVE : 0 ))
          echo "USDN_DIVISOR=$D"
          echo "USDNR_USDN_SHARES=$SHARES"
          echo "USDNR_USDN_BALANCE_CLOSEST=$BAL"
          echo "USDNR_USDN_BALANCE_ROUND_DOWN=$ROUND_DOWN"
          echo "USDNR_TOTAL_SUPPLY=$SUPPLY"
          echo "USDNR_RESERVE=$RESERVE"
          echo "USDNR_ACCRUED_YIELD_WEI=$YIELD"
          echo "USDNR_ACCRUED_YIELD_TOKENS=$(python3 -c 'import sys; print(int(sys.argv[1])/1e18)' "$YIELD")"
          echo "USDNR_YIELD_RECIPIENT=$RECIPIENT"
          echo "USDNR_OWNER=$OWNER"
          echo "SUSDN_VAULT=$SUSDN"
          if [[ "${RECIPIENT,,}" == "${SUSDN,,}" ]]; then
            echo 'YIELD_RECIPIENT_IS_SUSDN=true'
          else
            echo 'YIELD_RECIPIENT_IS_SUSDN=false'
          fi
          echo "RECIPIENT_USDN_BEFORE=$(cast call "$USDN" 'balanceOf(address)(uint256)' "$RECIPIENT" --rpc-url "$RPC")"
