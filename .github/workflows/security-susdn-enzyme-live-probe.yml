name: sUSDN Enzyme live configuration probe

on:
  workflow_dispatch: {}
  push:
    branches:
      - security/usdn-susdn-enzyme
    paths:
      - .github/workflows/security-susdn-enzyme-live-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RPC_URL: "https://ethereum-rpc.publicnode.com"
      SUSDN: "0xF67e2dC041b8A3c39d066037d29f500757b1e886"
      USDNR: "0x82957d600963Ae0C529c3819Ac7C349c4D49269B"
      USDN: "0xde17a000BA631c5d7c2Bd9FB692EFeA52D90DEE2"
      SUSDE: "0x9D39A5DE30e57443BfF2A8307A4256c8797A3497"
      USDT: "0xdAC17F958D2ee523a2206206994597C13D831ec7"
      VALUE_INTERPRETER: "0xD7B0610dB501b15Bfb9B7DDad8b3869de262a327"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Probe USDnr valuation route
        shell: bash
        run: |
          set -u
          ACCESSOR=$(cast call "$SUSDN" 'getAccessor()(address)' --rpc-url "$RPC_URL")
          echo "ACCESSOR=$ACCESSOR"
          echo -n 'GAV='; cast call "$ACCESSOR" 'calcGav()(uint256)' --rpc-url "$RPC_URL"
          echo -n 'GROSS_SHARE_VALUE='; cast call "$ACCESSOR" 'calcGrossShareValue()(uint256)' --rpc-url "$RPC_URL"
          echo -n 'SUSDN_TOTAL_SUPPLY='; cast call "$SUSDN" 'totalSupply()(uint256)' --rpc-url "$RPC_URL"
          echo -n 'USDNR_IN_SUSDN='; cast call "$USDNR" 'balanceOf(address)(uint256)' "$SUSDN" --rpc-url "$RPC_URL"

          echo '=== VALUE INTERPRETER CLASSIFICATION ==='
          for token in "$USDNR" "$USDN" "$SUSDE" "$USDT"; do
            echo "TOKEN=$token"
            echo -n ' supported='; cast call "$VALUE_INTERPRETER" 'isSupportedAsset(address)(bool)' "$token" --rpc-url "$RPC_URL" || true
            echo -n ' primitive='; cast call "$VALUE_INTERPRETER" 'isSupportedPrimitiveAsset(address)(bool)' "$token" --rpc-url "$RPC_URL" || true
            echo -n ' derivative='; cast call "$VALUE_INTERPRETER" 'isSupportedDerivativeAsset(address)(bool)' "$token" --rpc-url "$RPC_URL" || true
            echo -n ' aggregator='; cast call "$VALUE_INTERPRETER" 'getAggregatorForPrimitive(address)(address)' "$token" --rpc-url "$RPC_URL" || true
            echo -n ' rateAsset='; cast call "$VALUE_INTERPRETER" 'getRateAssetForPrimitive(address)(uint8)' "$token" --rpc-url "$RPC_URL" || true
            echo -n ' unit='; cast call "$VALUE_INTERPRETER" 'getUnitForPrimitive(address)(uint256)' "$token" --rpc-url "$RPC_URL" || true
            echo -n ' derivativeFeed='; cast call "$VALUE_INTERPRETER" 'getPriceFeedForDerivative(address)(address)' "$token" --rpc-url "$RPC_URL" || true
          done

          echo '=== CANONICAL VALUES, 1 TOKEN ==='
          echo -n 'USDnr_to_sUSDe='; cast call "$VALUE_INTERPRETER" 'calcCanonicalAssetValue(address,uint256,address)(uint256)' "$USDNR" 1000000000000000000 "$SUSDE" --rpc-url "$RPC_URL" || true
          echo -n 'USDN_to_sUSDe='; cast call "$VALUE_INTERPRETER" 'calcCanonicalAssetValue(address,uint256,address)(uint256)' "$USDN" 1000000000000000000 "$SUSDE" --rpc-url "$RPC_URL" || true
          echo -n 'USDnr_to_USDT='; cast call "$VALUE_INTERPRETER" 'calcCanonicalAssetValue(address,uint256,address)(uint256)' "$USDNR" 1000000000000000000 "$USDT" --rpc-url "$RPC_URL" || true
          echo -n 'USDN_to_USDT='; cast call "$VALUE_INTERPRETER" 'calcCanonicalAssetValue(address,uint256,address)(uint256)' "$USDN" 1000000000000000000 "$USDT" --rpc-url "$RPC_URL" || true

          FEED=$(cast call "$VALUE_INTERPRETER" 'getPriceFeedForDerivative(address)(address)' "$USDNR" --rpc-url "$RPC_URL" 2>/dev/null || true)
          echo "USDNR_DERIVATIVE_FEED=$FEED"
          if [[ "$FEED" =~ ^0x[0-9a-fA-F]{40}$ ]] && [[ "${FEED,,}" != "0x0000000000000000000000000000000000000000" ]]; then
            echo '=== DERIVATIVE FEED ==='
            echo -n 'calcUnderlyingValues_1USDnr='; cast call "$FEED" 'calcUnderlyingValues(address,uint256)(address[],uint256[])' "$USDNR" 1000000000000000000 --rpc-url "$RPC_URL" || true
            echo -n 'isSupportedAsset='; cast call "$FEED" 'isSupportedAsset(address)(bool)' "$USDNR" --rpc-url "$RPC_URL" || true
            echo -n 'owner='; cast call "$FEED" 'getOwner()(address)' --rpc-url "$RPC_URL" || cast call "$FEED" 'owner()(address)' --rpc-url "$RPC_URL" || true
          fi

          echo '=== USDNR REAL REDEMPTION/BACKING ==='
          echo -n 'USDNR_TOTAL_SUPPLY='; cast call "$USDNR" 'totalSupply()(uint256)' --rpc-url "$RPC_URL"
          echo -n 'USDN_DIVISOR='; cast call "$USDN" 'divisor()(uint256)' --rpc-url "$RPC_URL"
          echo -n 'USDN_BALANCE_IN_USDNR='; cast call "$USDN" 'balanceOf(address)(uint256)' "$USDNR" --rpc-url "$RPC_URL"
          echo -n 'USDN_SHARES_IN_USDNR='; cast call "$USDN" 'sharesOf(address)(uint256)' "$USDNR" --rpc-url "$RPC_URL"
          echo -n 'SUSDE_ASSETS_PER_1e18_SHARES='; cast call "$SUSDE" 'convertToAssets(uint256)(uint256)' 1000000000000000000 --rpc-url "$RPC_URL" || true
          echo -n 'SUSDE_PREVIEW_REDEEM_1e18='; cast call "$SUSDE" 'previewRedeem(uint256)(uint256)' 1000000000000000000 --rpc-url "$RPC_URL" || true
