name: sUSDN Enzyme live configuration probe

on:
  workflow_dispatch: {}
  push:
    branches:
      - security/usdn-susdn-enzyme
    paths:
      - .github/workflows/security-susdn-enzyme-live-probe.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      RPC_URL: "https://ethereum-rpc.publicnode.com"
      SUSDN: "0xF67e2dC041b8A3c39d066037d29f500757b1e886"
      OLD_ACCESSOR: "0x0b1b0323f61ADAa27664cF1dA76a1ADAD026e7DC"
      USDNR: "0x82957d600963Ae0C529c3819Ac7C349c4D49269B"
      USDN: "0xde17a000BA631c5d7c2Bd9FB692EFeA52D90DEE2"
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Probe sUSDN and Enzyme configuration
        shell: bash
        run: |
          set -u
          CURRENT_ACCESSOR=$(cast call "$SUSDN" 'getAccessor()(address)' --rpc-url "$RPC_URL")
          echo "CURRENT_ACCESSOR=$CURRENT_ACCESSOR"
          echo "OLD_ACCESSOR=$OLD_ACCESSOR"

          echo '=== BASIC VAULT ==='
          for sig in \
            'name()(string)' \
            'symbol()(string)' \
            'decimals()(uint8)' \
            'totalSupply()(uint256)' \
            'getAccessor()(address)' \
            'getCreator()(address)' \
            'getOwner()(address)' \
            'getNominatedOwner()(address)' \
            'getVaultLib()(address)' \
            'getTrackedAssets()(address[])' \
            'getActiveExternalPositions()(address[])'; do
              echo "VAULT_CALL $sig"
              cast call "$SUSDN" "$sig" --rpc-url "$RPC_URL" || true
          done

          probe_accessor() {
            local label="$1"
            local accessor="$2"
            echo "=== ${label} ACCESSOR $accessor ==="
            for sig in \
              'getVaultProxy()(address)' \
              'getDenominationAsset()(address)' \
              'getSharesActionTimelock()(uint256)' \
              'getFundDeployer()(address)' \
              'calcGav()(uint256)' \
              'calcGrossShareValue()(uint256)' \
              'getFeeManager()(address)' \
              'getPolicyManager()(address)' \
              'getIntegrationManager()(address)' \
              'getValueInterpreter()(address)'; do
                echo "ACCESSOR_CALL $sig"
                cast call "$accessor" "$sig" --rpc-url "$RPC_URL" || true
            done
          }
          probe_accessor CURRENT "$CURRENT_ACCESSOR"
          probe_accessor OLD "$OLD_ACCESSOR"

          echo '=== TRACKED ASSET BALANCES ==='
          TRACKED=$(cast call "$SUSDN" 'getTrackedAssets()(address[])' --rpc-url "$RPC_URL")
          echo "TRACKED_RAW=$TRACKED"
          echo "$TRACKED" | grep -oE '0x[0-9a-fA-F]{40}' | while read -r token; do
            echo "ASSET=$token"
            echo -n '  symbol='; cast call "$token" 'symbol()(string)' --rpc-url "$RPC_URL" 2>/dev/null || echo '?'
            echo -n '  decimals='; cast call "$token" 'decimals()(uint8)' --rpc-url "$RPC_URL" 2>/dev/null || echo '?'
            echo -n '  vaultBalance='; cast call "$token" 'balanceOf(address)(uint256)' "$SUSDN" --rpc-url "$RPC_URL" 2>/dev/null || echo '?'
          done

          echo '=== USDNR BACKING ==='
          for sig in \
            'name()(string)' \
            'symbol()(string)' \
            'totalSupply()(uint256)' \
            'USDN()(address)' \
            'getYieldRecipient()(address)' \
            'owner()(address)'; do
              echo "USDNR_CALL $sig"
              cast call "$USDNR" "$sig" --rpc-url "$RPC_URL" || true
          done
          echo -n 'USDN_DIVISOR='; cast call "$USDN" 'divisor()(uint256)' --rpc-url "$RPC_URL"
          echo -n 'USDN_TOKEN_BALANCE_OF_USDNR='; cast call "$USDN" 'balanceOf(address)(uint256)' "$USDNR" --rpc-url "$RPC_URL"
          echo -n 'USDN_SHARES_OF_USDNR='; cast call "$USDN" 'sharesOf(address)(uint256)' "$USDNR" --rpc-url "$RPC_URL"
          echo -n 'USDN_TOKEN_BALANCE_OF_SUSDN='; cast call "$USDN" 'balanceOf(address)(uint256)' "$SUSDN" --rpc-url "$RPC_URL"
          echo -n 'USDNR_BALANCE_OF_SUSDN='; cast call "$USDNR" 'balanceOf(address)(uint256)' "$SUSDN" --rpc-url "$RPC_URL"
