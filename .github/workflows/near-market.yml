name: USDN near-market rounding probe

on:
  push:
    branches:
      - security/usdn-rounding-near-market

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - run: forge test --match-contract TestLiquidationRoundingNearMarket -vvv
