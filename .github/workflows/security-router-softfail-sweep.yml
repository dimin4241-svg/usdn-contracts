name: USDN Router soft-fail custody proof

on:
  push:
    branches:
      - security/usdn-router-softfail-sweep

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone exact deployed Router snapshot
        run: |
          set -euo pipefail
          git clone https://github.com/SmarDex-Ecosystem/universal-router.git /tmp/router
          cd /tmp/router
          git checkout 2b9465ba87c23654c2eacce2088f5794ea08a006
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          npm ci
          forge soldeer install

      - name: Run isolated exact-Router PoC
        env:
          FOUNDRY_PROFILE: default
        run: |
          set -euo pipefail
          cd /tmp/router
          rm -rf test
          mkdir -p test
          cp "$GITHUB_WORKSPACE/security/RouterSoftFailSweepPoC.t.sol" test/RouterSoftFailSweepPoC.t.sol
          forge test --match-contract TestRouterSoftFailSweepPoC -vvvv
