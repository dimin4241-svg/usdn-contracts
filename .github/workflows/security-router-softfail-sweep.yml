name: USDN Router custody and preload proof

on:
  push:
    branches:
      - security/usdn-router-softfail-sweep

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone exact deployed Router snapshot
        run: |
          set -euo pipefail
          git clone https://github.com/SmarDex-Ecosystem/universal-router.git /tmp/router
          cd /tmp/router
          git checkout 2b9465ba87c23654c2eacce2088f5794ea08a006
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          npm ci
          forge soldeer install

      - name: Run isolated exact-Router soft-fail PoC
        env:
          FOUNDRY_PROFILE: default
        run: |
          set -euo pipefail
          cd /tmp/router
          rm -rf test
          mkdir -p test
          cp "$GITHUB_WORKSPACE/security/RouterSoftFailSweepPoC.t.sol" test/RouterSoftFailSweepPoC.t.sol
          forge test --match-contract TestRouterSoftFailSweepPoC -vvv

      - name: Quantify current mainnet preload sensitivity
        env:
          PROTOCOL: '0x656cb8c6d154aad29d8771384089be5b5141f01a'
          RPC_URL: 'https://ethereum-rpc.publicnode.com'
        run: |
          set -euo pipefail
          RATIO=$(cast call "$PROTOCOL" 'getSdexBurnOnDepositRatio()(uint32)' --rpc-url "$RPC_URL" | awk '{print $1}')
          PRICE=$(cast call "$PROTOCOL" 'getLastPrice()(uint128)' --rpc-url "$RPC_URL" | awk '{print $1}')
          TS=$(cast call "$PROTOCOL" 'getLastUpdateTimestamp()(uint128)' --rpc-url "$RPC_URL" | awk '{print $1}')
          echo "sdexBurnOnDepositRatio=$RATIO"
          echo "lastPrice=$PRICE"
          echo "lastUpdateTimestamp=$TS"
          export PRICE TS
          python3 - <<'PY'
          import os, subprocess
          protocol=os.environ['PROTOCOL']; rpc=os.environ['RPC_URL']
          price=int(os.environ['PRICE']); ts=int(os.environ['TS']); base=10**17
          def preview(amount):
              p=subprocess.run(['cast','call',protocol,'previewDeposit(uint256,uint128,uint128)(uint256,uint256)',str(amount),str(price),str(ts),'--rpc-url',rpc],text=True,capture_output=True)
              if p.returncode: raise RuntimeError((p.stderr or p.stdout).strip())
              v=[int(x.strip().split()[0]) for x in p.stdout.splitlines() if x.strip()]
              return v[0],v[1]
          shares0,sdex0=preview(base)
          _,sdex1=preview(base+1)
          print('baseAmountWei',base)
          print('basePreviewShares',shares0)
          print('baseSdexToBurnWei',sdex0)
          print('oneWeiPreloadSdexToBurnWei',sdex1)
          print('oneWeiPreloadSdexDeltaWei',sdex1-sdex0)
          if sdex1 <= sdex0: raise RuntimeError('1 wei preload did not increase SDEX requirement')
          PY

      - name: Run live mainnet-fork preload grief PoC
        env:
          FOUNDRY_PROFILE: default
          MAINNET_RPC_URL: 'https://ethereum-rpc.publicnode.com'
        run: |
          set -euo pipefail
          cd /tmp/router
          cp "$GITHUB_WORKSPACE/security/RouterMainnetPreloadGriefPoC.t.sol" test/RouterMainnetPreloadGriefPoC.t.sol
          forge test --match-contract TestRouterMainnetPreloadGriefPoC -vvvv
