name: USDN post-bootstrap fix validation

on:
  push:
    branches:
      - security/usdn-rounding-fix-post-bootstrap-validation

permissions:
  contents: read

jobs:
  fix-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Run fully post-bootstrap fixed accounting witness
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapFixAccounting -vvvv
      - name: Run fully post-bootstrap fixed withdrawal impact witness
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapFixImpact -vvvv
      - name: Keep upstream Rebalancer invariant tests green
        run: forge test --match-contract TestUsdnProtocolActionsRebalancer -vvvv
