name: USDN post-bootstrap fix validation

on:
  push:
    branches:
      - security/usdn-rounding-fix-post-bootstrap-validation

permissions:
  contents: read

jobs:
  fix-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-50dd4b8accae878391b0825885f0632d1e0a1e4c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && forge soldeer install
      - name: Run whole-dollar fixed accounting witness
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapWholeDollarFixValidation -vvvv
      - name: Validate same whole-dollar source gap and fix at 10x collateral scale
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapScale10xFixValidation -vvvv
      - name: Run fully post-bootstrap fixed withdrawal impact witness
        run: forge test --match-contract TestLiquidationRoundingPostBootstrapFixImpact -vvvv
      - name: Keep upstream Rebalancer invariant tests green
        run: forge test --match-path 'test/unit/UsdnProtocol/Long/_TriggerRebalancer.t.sol' -vvvv
