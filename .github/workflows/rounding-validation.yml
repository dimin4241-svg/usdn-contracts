name: USDN rounding validation

on:
  push:
    branches:
      - security/usdn-rounding-ordinary-positions

permissions:
  contents: read

jobs:
  rounding-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci && forge soldeer install

      - name: Trace ordinary-position harness
        run: forge test --match-contract TestLiquidationRoundingOrdinaryPositions -vvvv
