name: USDN rounding validation

on:
  push:
    branches:
      - security/usdn-rounding-fix

permissions:
  contents: read

jobs:
  rounding-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci && forge soldeer install

      - name: Check formatting
        run: forge fmt --check

      - name: Run ordinary-only rounding regression
        run: forge test --match-contract TestLiquidationRoundingOrdinaryPositions -vvv

      - name: Run production-config rounding regression
        run: forge test --match-contract TestLiquidationRoundingProductionInvariant -vvv

      - name: Preserve Rebalancer invariant checks
        run: forge test --match-contract TestUsdnProtocolLongTriggerRebalancer -vvv

      - name: Run core liquidation-position tests
        run: forge test --match-contract TestUsdnProtocolLongLiquidatePositions -vvv

      - name: Run public liquidation action tests
        run: forge test --match-path test/unit/UsdnProtocol/Actions/Liquidation.t.sol -vvv
