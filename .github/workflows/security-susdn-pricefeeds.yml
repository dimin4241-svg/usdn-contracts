name: sUSDN tracked asset price feeds

on:
  push:
    branches: [security/susdn-live-config]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Inspect ValueInterpreter feeds
        env:
          RPC_URL: https://ethereum-rpc.publicnode.com
          VAULT: '0xF67e2dC041b8A3c39d066037d29f500757b1e886'
          VI: '0xD7B0610dB501b15Bfb9B7DDad8b3869de262a327'
          SUSDE: '0x9D39A5DE30e57443BfF2A8307A4256c8797A3497'
          USDN: '0xde17a000BA631c5d7c2Bd9FB692EFeA52D90DEE2'
          USDT: '0xdAC17F958D2ee523a2206206994597C13D831ec7'
          USDNR: '0x82957d600963Ae0C529c3819Ac7C349c4D49269B'
        shell: bash
        run: |
          set -euo pipefail
          echo "FEED_BLOCK=$(cast block-number --rpc-url "$RPC_URL")"
          echo "VI_STALE_THRESHOLD=$(cast call "$VI" 'getStaleRateThreshold()(uint256)' --rpc-url "$RPC_URL")"
          for entry in "sUSDe:$SUSDE" "USDN:$USDN" "USDT:$USDT" "USDnr:$USDNR"; do
            label=${entry%%:*}; asset=${entry#*:}
            agg=$(cast call "$VI" 'getAggregatorForPrimitive(address)(address)' "$asset" --rpc-url "$RPC_URL")
            rate=$(cast call "$VI" 'getRateAssetForPrimitive(address)(uint8)' "$asset" --rpc-url "$RPC_URL")
            unit=$(cast call "$VI" 'getUnitForPrimitive(address)(uint256)' "$asset" --rpc-url "$RPC_URL")
            echo "${label}_ASSET=$asset"
            echo "${label}_AGGREGATOR=$agg"
            echo "${label}_RATE_ASSET=$rate"
            echo "${label}_UNIT=$unit"
            if [[ "${agg,,}" != "0x0000000000000000000000000000000000000000" ]]; then
              echo "${label}_AGG_DECIMALS=$(cast call "$agg" 'decimals()(uint8)' --rpc-url "$RPC_URL" 2>/dev/null || echo FAILED)"
              echo "${label}_AGG_DESCRIPTION=$(cast call "$agg" 'description()(string)' --rpc-url "$RPC_URL" 2>/dev/null || echo FAILED)"
              echo "${label}_LATEST_ROUND=$(cast call "$agg" 'latestRoundData()(uint80,int256,uint256,uint256,uint80)' --rpc-url "$RPC_URL" 2>/dev/null || echo FAILED)"
            fi
          done
          echo "USDNR_OWNER=$(cast call "$USDNR" 'owner()(address)' --rpc-url "$RPC_URL")"
          echo "USDNR_TOTAL_SUPPLY=$(cast call "$USDNR" 'totalSupply()(uint256)' --rpc-url "$RPC_URL")"
          echo "USDNR_VAULT_BALANCE=$(cast call "$USDNR" 'balanceOf(address)(uint256)' "$VAULT" --rpc-url "$RPC_URL")"
          echo "USDN_VAULT_BALANCE=$(cast call "$USDN" 'balanceOf(address)(uint256)' "$VAULT" --rpc-url "$RPC_URL")"
          echo "SUSDE_VAULT_BALANCE=$(cast call "$SUSDE" 'balanceOf(address)(uint256)' "$VAULT" --rpc-url "$RPC_URL")"
