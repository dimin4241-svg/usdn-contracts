name: LongFarming live slash scan

on:
  push:
    branches:
      - audit/longfarming-post-liquidation-rewards
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Scan read-only Ethereum logs
        env:
          LONG_FARMING: "0xF9D36078A248AF249AA57ae1D5D0c1033d6Bbe27"
          USDN_PROTOCOL: "0x656cB8C6d154Aad29d8771384089be5B5141f01a"
          DEPLOYMENT_BLOCK: "21681344"
          TARGET_TICK: "82000"
          TARGET_VERSION: "0"
        run: |
          python - <<'PY'
          import json, os, subprocess, urllib.parse, urllib.request
          from datetime import datetime, timezone

          LONG = os.environ['LONG_FARMING'].lower()
          USDN = os.environ['USDN_PROTOCOL'].lower()
          DEPLOYMENT_BLOCK = int(os.environ['DEPLOYMENT_BLOCK'])
          TARGET_TICK = int(os.environ['TARGET_TICK'])
          TARGET_VERSION = int(os.environ['TARGET_VERSION'])
          BLOCKSCOUT = 'https://eth.blockscout.com/api'
          RPCS = [
              'https://ethereum-rpc.publicnode.com',
              'https://eth.llamarpc.com',
              'https://rpc.flashbots.net',
              'https://cloudflare-eth.com',
          ]

          def keccak_sig(sig):
              return subprocess.check_output(['cast','keccak',sig], text=True).strip().lower()

          SLASH = keccak_sig('Slash(address,uint256,uint256,int24,uint256,uint256)')
          LIQ = keccak_sig('LiquidatedTick(int24,uint256,uint256,uint256,int256)')
          print('SLASH_TOPIC', SLASH)
          print('LIQUIDATED_TICK_TOPIC', LIQ)

          def topic_uint(v):
              if v < 0:
                  v = (1 << 256) + v
              return '0x' + format(v, '064x')

          def blockscout_logs(address, topic0, **extra_topics):
              params = {
                  'module': 'logs',
                  'action': 'getLogs',
                  'fromBlock': str(DEPLOYMENT_BLOCK),
                  'toBlock': 'latest',
                  'address': address,
                  'topic0': topic0,
              }
              params.update(extra_topics)
              if 'topic1' in extra_topics:
                  params['topic0_1_opr'] = 'and'
              if 'topic2' in extra_topics:
                  params['topic1_2_opr'] = 'and'
                  params['topic0_2_opr'] = 'and'
              url = BLOCKSCOUT + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent':'LongFarming-readonly-audit'})
              with urllib.request.urlopen(req, timeout=90) as r:
                  out = json.loads(r.read())
              print('BLOCKSCOUT_STATUS', out.get('status'), out.get('message'))
              result = out.get('result')
              if not isinstance(result, list):
                  raise RuntimeError(str(result or out.get('message')))
              return result

          liq_logs = blockscout_logs(
              USDN,
              LIQ,
              topic1=topic_uint(TARGET_TICK),
              topic2=topic_uint(TARGET_VERSION),
          )
          slash_logs = blockscout_logs(LONG, SLASH)

          print('TARGET_LIQUIDATED_TICK_LOGS', len(liq_logs))
          print('TOTAL_SLASH_LOGS', len(slash_logs))

          def h2i(v):
              if isinstance(v, int):
                  return v
              return int(v, 16) if str(v).startswith('0x') else int(v)

          def words(data):
              h = data[2:] if data.startswith('0x') else data
              return [int(h[i:i+64], 16) for i in range(0, len(h), 64) if h[i:i+64]]

          def signed(v):
              return v - (1 << 256) if v >= (1 << 255) else v

          liq_rows = []
          for x in liq_logs:
              liq_rows.append({
                  'block': h2i(x['blockNumber']),
                  'tx': x['transactionHash'],
                  'logIndex': h2i(x['logIndex']),
              })
          for row in liq_rows:
              print('LIQ_RESULT', json.dumps(row, sort_keys=True))

          targets = []
          for x in slash_logs:
              w = words(x['data'])
              if len(w) < 5:
                  continue
              notifier_rewards, owner_rewards, tick_raw, version, index = w[:5]
              tick = signed(tick_raw)
              if tick != TARGET_TICK or version != TARGET_VERSION:
                  continue
              notifier = '0x' + x['topics'][1][-40:]
              targets.append({
                  'block': h2i(x['blockNumber']),
                  'tx': x['transactionHash'],
                  'notifier': notifier.lower(),
                  'notifierRewards': notifier_rewards,
                  'ownerRewards': owner_rewards,
                  'tick': tick,
                  'version': version,
                  'index': index,
                  'ownerEqualsNotifier': notifier_rewards == 0 and owner_rewards > 0,
              })

          print('TARGET_SLASHES', len(targets))

          rpc_id = 0
          def rpc(method, params):
              global rpc_id
              errors = []
              for url in RPCS:
                  try:
                      rpc_id += 1
                      body = json.dumps({'jsonrpc':'2.0','id':rpc_id,'method':method,'params':params}).encode()
                      req = urllib.request.Request(url, data=body, headers={'Content-Type':'application/json','User-Agent':'LongFarming-readonly-audit'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          out = json.loads(r.read())
                      if 'error' in out:
                          raise RuntimeError(str(out['error']))
                      return out['result']
                  except Exception as e:
                      errors.append(f'{url}: {e!r}')
              raise RuntimeError('; '.join(errors))

          block_cache = {}
          def block_meta(n):
              if n not in block_cache:
                  b = rpc('eth_getBlockByNumber', [hex(n), False])
                  ts = int(b['timestamp'], 16)
                  block_cache[n] = {
                      'timestamp': ts,
                      'utc': datetime.fromtimestamp(ts, timezone.utc).isoformat(),
                  }
              return block_cache[n]

          liq_block = min((r['block'] for r in liq_rows), default=None)
          for t in sorted(targets, key=lambda z: z['block']):
              out = dict(t)
              out['notifierRewardsSDEX'] = str(t['notifierRewards'] / 10**18)
              out['ownerRewardsSDEX'] = str(t['ownerRewards'] / 10**18)
              out['totalSlashRewardsSDEX'] = str((t['notifierRewards'] + t['ownerRewards']) / 10**18)
              out['slashTime'] = block_meta(t['block'])
              if liq_block is not None:
                  out['liquidationBlock'] = liq_block
                  out['liquidationTime'] = block_meta(liq_block)
                  out['delayBlocks'] = t['block'] - liq_block
                  out['delaySeconds'] = block_meta(t['block'])['timestamp'] - block_meta(liq_block)['timestamp']
              print('TARGET_RESULT', json.dumps(out, sort_keys=True))

          if not liq_rows:
              raise SystemExit('No LiquidatedTick(82000,0) found')
          if not targets:
              raise SystemExit('No Slash for tick=82000/version=0 found')
          PY
